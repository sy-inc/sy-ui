  - "packages/**/**"

overrides:
  js-yaml@3: "^3.15.2"
  js-yaml@4: "^4.3.2"
  shiki: 3.20.0
  svgo: 2.8.4
  ts-morph: 27.0.2
  # Security patches for versions still pulled by the current parent ranges.
  sharp: 0.35.5
  source-map-js: 1.2.2
  postcss-selector-parser@6: 6.1.5
  postcss-selector-parser@7: 7.1.6
  brace-expansion@1: 1.1.21
  brace-expansion@2: 2.1.7
  brace-expansion@5: 5.0.12
